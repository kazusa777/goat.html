<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f0e6">
  <title>Home</title>
  <style>
    :root { color-scheme: light; font-family: "DFKai-SB", "BiauKai", "標楷體", KaiTi, serif; background: #f4f0e6; color: #24231f; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; background: radial-gradient(ellipse at 4% 8%, #e7dcc5 0, transparent 30%), #f4f0e6; font-family: inherit; }
    main { width: min(1160px, 100%); margin: 0 auto; padding: clamp(54px, 8vw, 96px) 28px 72px; }
    .toolbar { display: flex; align-items: center; gap: 18px; margin-bottom: 24px; }
    #search { flex: 1; min-width: 0; height: 64px; border: 2px solid #302e28; border-radius: 15px; padding: 0 20px; background: #fffdf8; color: inherit; font-family: inherit; font-size: 24px; line-height: 1.2; box-shadow: 5px 5px 0 #dfd2b8; }
    #search::placeholder { color: #817a6c; }
    #search:focus { outline: 3px solid #cf9c55; outline-offset: 3px; }
    #status { flex: 0 0 auto; color: #5e594f; font-size: 21px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 350px), 1fr)); gap: 19px; }
    .page-card { display: flex; min-height: 132px; flex-direction: column; justify-content: space-between; gap: 16px; padding: 22px 24px; border: 2px solid #302e28; border-radius: 18px; background: #fffdf8; color: inherit; text-decoration: none; box-shadow: 5px 5px 0 #dfd2b8; transition: transform .18s ease, box-shadow .18s ease, background .18s ease; }
    .page-card:hover, .page-card:focus-visible { transform: translate(-3px, -3px); background: #fff; box-shadow: 8px 8px 0 #cfb88d; outline: none; }
    .page-title { font-size: 27px; line-height: 1.35; overflow-wrap: anywhere; }
    .page-path { color: #766f62; font-size: 17px; overflow-wrap: anywhere; }
    .state { grid-column: 1 / -1; padding: 28px; border: 2px dashed #aaa08e; border-radius: 18px; color: #6e675a; font-size: 22px; }
    @media (max-width: 560px) {
      main { padding: 82px 18px 40px; }
      .toolbar { align-items: stretch; flex-direction: column; gap: 10px; }
      #search { flex: none; width: 100%; height: 58px; font-size: 21px; }
      #status { font-size: 19px; }
      .grid { grid-template-columns: 1fr; gap: 14px; }
      .page-card { min-height: 112px; padding: 18px 19px; }
      .page-title { font-size: 24px; }
      .page-path { font-size: 16px; }
    }
    @media (prefers-reduced-motion: reduce) { .page-card { transition: none; } }
  </style>
</head>
<body>
  <main>
    <div class="toolbar">
      <input id="search" type="search" placeholder="找網頁…" aria-label="搜尋網頁">
      <span id="status" aria-live="polite">清單讀取中…</span>
    </div>
    <section id="pages" class="grid" aria-label="所有網頁">
      <div class="state">清單讀取中…</div>
    </section>
  </main>
  <script>
    (() => {
      const owner = 'kazusa777';
      const repo = 'goat.html';
      const search = document.querySelector('#search');
      const list = document.querySelector('#pages');
      const status = document.querySelector('#status');
      let pages = [];
      const names = {
        'home.html': 'Home',
        '影片比對1.0.html': '影片比對 1.0',
        '賽爾號台服鑽石轉換工具1.0.html': '賽爾號台服鑽石轉換工具 1.0',
        '賽爾號台服鑽石轉換工具2.0.html': '賽爾號台服鑽石轉換工具 2.0',
        'html/index.html': '山羊介紹',
        'html/link_to_page1.html': '台灣山羊',
        'html/link_to_page2.html': '巴貝多綿羊',
        'html/link_to_page3.html': '波爾山羊',
        'html/link_to_page4.html': '阿爾拜因山羊',
        'html/link_to_page5.html': '努比亞山羊',
        'html/link_to_page6.html': '圖片集'
      };

      function render() {
        const term = search.value.trim().toLocaleLowerCase();
        const shown = pages.filter(page => `${page.name} ${page.path}`.toLocaleLowerCase().includes(term));
        list.replaceChildren();
        status.textContent = `${shown.length} 個網頁`;
        for (const page of shown) {
          const card = document.createElement('a');
          card.className = 'page-card';
          card.href = page.url;
          const title = document.createElement('span');
          title.className = 'page-title';
          title.textContent = page.name;
          const path = document.createElement('span');
          path.className = 'page-path';
          path.textContent = page.path;
          card.append(title, path);
          list.append(card);
        }
        if (!shown.length) {
          const empty = document.createElement('div');
          empty.className = 'state';
          empty.textContent = pages.length ? '找不到符合的網頁。' : '目前沒有 HTML 網頁。';
          list.append(empty);
        }
      }

      async function load() {
        try {
          const api = `https://api.github.com/repos/${owner}/${encodeURIComponent(repo)}`;
          const infoResponse = await fetch(api);
          if (!infoResponse.ok) throw new Error(`GitHub API ${infoResponse.status}`);
          const info = await infoResponse.json();
          const treeResponse = await fetch(`${api}/git/trees/${encodeURIComponent(info.default_branch)}?recursive=1`);
          if (!treeResponse.ok) throw new Error(`GitHub API ${treeResponse.status}`);
          const tree = await treeResponse.json();
          const script = document.querySelector('script[src*="site-nav.js"]');
          const root = script ? new URL('./', script.src) : new URL('./', location.href);
          pages = (tree.tree || [])
            .filter(file => file.type === 'blob' && /\.html?$/i.test(file.path))
            .map(file => {
              const filename = file.path.split('/').pop();
              return { path: file.path, name: names[file.path] || filename.replace(/\.html?$/i, '').replace(/[-_]+/g, ' '), url: new URL(file.path.split('/').map(encodeURIComponent).join('/'), root).href };
            })
            .sort((a, b) => a.path.localeCompare(b.path, 'zh-Hant'));
          render();
        } catch (error) {
          status.textContent = '清單讀取失敗';
          list.innerHTML = '';
          const message = document.createElement('div');
          message.className = 'state';
          message.textContent = `${error.message}；請用 GitHub Pages 網址開啟。`;
          list.append(message);
        }
      }
      search.addEventListener('input', render);
      load();
    })();
  </script>
  <script src="./site-nav.js" data-goat-site-nav defer></script>
</body>
</html>
