<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>賽爾號鑽石轉換工具</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#141c30;--line:#293752;--text:#edf3ff;--muted:#aab8d0;--cyan:#67e8f9;--blue:#818cf8;--gold:#facc15}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 20% 0%,#1b3151 0,transparent 45%),var(--bg);color:var(--text);font:16px/1.55 system-ui,"Microsoft JhengHei",sans-serif;padding:32px 16px 56px}.wrap{max-width:960px;margin:auto}header{margin:0 0 24px}h1{font-size:clamp(26px,5vw,38px);line-height:1.2;margin:0 0 8px;letter-spacing:.02em}.sub,.muted{color:var(--muted)}.card{background:linear-gradient(145deg,#17223a,#11192b);border:1px solid var(--line);border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 12px 32px #0002}.label{display:block;font-weight:700;margin-bottom:7px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.field input,select{width:100%;padding:13px 14px;border-radius:11px;border:1px solid #394968;background:#0c1425;color:var(--text);font-size:17px;outline:none}.field input:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #67e8f922}.hint{font-size:13px;color:var(--muted);margin-top:6px}.split{display:flex;gap:14px;align-items:end;flex-wrap:wrap}.split>div{flex:1;min-width:210px}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.result{background:#0c1425;border:1px solid #293752;border-radius:13px;padding:16px}.result small{display:block;color:var(--muted);margin-bottom:4px}.result strong{font-size:23px}.accent{color:var(--cyan)}.gold{color:var(--gold)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:620px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #293752}th{color:var(--muted);font-size:14px}td:last-child,th:last-child{text-align:right}.total{font-weight:800;color:var(--gold)}.items{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{border:1px solid var(--line);background:#0c1425;border-radius:12px;padding:12px}.item label{display:flex;align-items:center;gap:9px;font-weight:700}.item input{accent-color:#67e8f9;width:17px;height:17px}.item span{display:block;color:var(--muted);font-size:13px;margin:5px 0 0 26px}.foot{font-size:13px;color:var(--muted);margin-top:14px}.pill{display:inline-block;color:#c4b5fd;background:#8b5cf622;border:1px solid #8b5cf655;border-radius:99px;padding:3px 10px;font-size:13px;margin-left:8px}
@media(max-width:650px){body{padding:22px 12px 40px}.card{padding:17px}.grid,.results{grid-template-columns:1fr}.items{grid-template-columns:1fr}}
</style>
</head>
<body><main class="wrap">
<header><h1>賽爾號鑽石轉換工具</h1><div class="sub">輸入台幣、台服鑽石或陸服鑽石，立即換算另外兩種金額。</div></header>
<section class="card"><div class="split"><div><label class="label" for="rate">匯率方案</label><select id="rate"><option value="a">方案一：陸服 680 鑽 = 台服 78 鑽</option><option value="b">方案二：陸服 998 鑽 = 台服 140 鑽</option></select></div><div><span class="label">台幣換算</span><div style="padding:13px 14px;border-radius:11px;border:1px solid #394968;background:#0c1425;color:var(--cyan);font-weight:700">台服 1 鑽 = NT$5</div></div></div></section>
<section class="card"><div class="grid"><div class="field"><label class="label" for="ntd">台幣 (NT$)</label><input id="ntd" type="number" min="0" step="any" placeholder="輸入台幣"></div><div class="field"><label class="label" for="tw">台服鑽石</label><input id="tw" type="number" min="0" step="any" placeholder="輸入台服鑽石"></div><div class="field"><label class="label" for="cn">陸服鑽石</label><input id="cn" type="number" min="0" step="any" placeholder="輸入陸服鑽石"></div></div><div class="hint">可編輯任一欄位；鑽石換算採四捨五入至整數。</div></section>
<section class="card"><h2 style="margin:0 0 14px;font-size:19px">換算結果</h2><div class="results"><div class="result"><small>台幣估算</small><strong class="gold" id="outNtd">—</strong></div><div class="result"><small>台服鑽石</small><strong class="accent" id="outTw">—</strong></div><div class="result"><small>陸服鑽石</small><strong id="outCn">—</strong></div></div></section>
<section class="card"><div class="split" style="align-items:center;justify-content:space-between"><div><h2 style="margin:0;font-size:19px">預算清單</h2><div class="hint">勾選項目計算總預算；妙時天女可選大禮包。</div></div><label style="display:flex;align-items:center;gap:8px"><input id="bundle" type="checkbox" style="accent-color:#67e8f9;width:17px;height:17px">妙時天女大禮包</label></div><div class="tablewrap" style="margin-top:12px"><table><thead><tr><th>項目</th><th>陸服鑽石</th><th>台服折合</th><th>台幣預估</th><th></th></tr></thead><tbody id="rows"></tbody><tfoot><tr class="total"><td>勾選總計</td><td id="sumCn">0 鑽</td><td id="sumTw">0 鑽</td><td id="sumNtd">NT$0</td><td></td></tr></tfoot></table></div><div class="foot" id="roundNote"></div></section>
</main><script>
const profiles={a:{cn:680,tw:78},b:{cn:998,tw:140}};
const baseItems=[{name:'薇爾詩',cn:798,checked:true},{name:'妙時天女',cn:998,checked:true},{name:'黃金殘影刻印（2組）',cn:6376,checked:true},{name:'赤洲龍子刻印（2組）',cn:7172,checked:true}];
const ids=['ntd','tw','cn'];let last='';const $=id=>document.getElementById(id);const fmt=n=>Math.round(n).toLocaleString('zh-TW');
const price=5;
function convert(from,value){const p=profiles[$('rate').value];let tw,cn,ntd;if(from==='ntd'){ntd=value;tw=value/price;cn=tw*p.cn/p.tw}else if(from==='tw'){tw=value;cn=tw*p.cn/p.tw;ntd=tw*price}else{cn=value;tw=cn*p.tw/p.cn;ntd=tw*price}return {ntd,tw,cn}}
function show(from){const raw=$(from).value;if(raw===''){for(const id of ids)if(id!==from)$(id).value='';$('outNtd').textContent=$('outTw').textContent=$('outCn').textContent='—';last=from;return}const r=convert(from,Number(raw));for(const id of ids)if(id!==from)$(id).value=String(Math.round(r[id]));$('outNtd').textContent='NT$'+fmt(r.ntd);$('outTw').textContent=fmt(r.tw)+' 鑽';$('outCn').textContent=fmt(r.cn)+' 鑽';last=from}
ids.forEach(id=>$(id).addEventListener('input',()=>show(id)));$('rate').addEventListener('change',()=>{if(last&&$(last).value!=='')show(last);renderRows()});$('bundle').addEventListener('change',renderRows);
function renderRows(){const p=profiles[$('rate').value],bundle=$('bundle').checked;let sumCn=0,sumTw=0;const tbody=$('rows');tbody.innerHTML='';baseItems.forEach((item,i)=>{const cn=item.cn+(i===1&&bundle?1000:0),tw=Math.round(cn*p.tw/p.cn),ntd=tw*price;sumCn+=cn;sumTw+=tw;const tr=document.createElement('tr');tr.innerHTML=`<td>${item.name}${i===1&&bundle?' <span class="pill">大禮包</span>':''}</td><td>${fmt(cn)} 鑽</td><td>${fmt(tw)} 鑽</td><td>NT$${fmt(ntd)}</td><td><input type="checkbox" aria-label="計入${item.name}" ${item.checked?'checked':''}></td>`;const cb=tr.querySelector('input');cb.addEventListener('change',()=>{item.checked=cb.checked;renderRows()});tbody.appendChild(tr)});const selected=baseItems.filter(x=>x.checked);sumCn=selected.reduce((s,x,i)=>s+x.cn+(x.name==='妙時天女'&&bundle?1000:0),0);sumTw=selected.reduce((s,x)=>s+Math.round((x.cn+(x.name==='妙時天女'&&bundle?1000:0))*p.tw/p.cn),0);$('sumCn').textContent=fmt(sumCn)+' 鑽';$('sumTw').textContent=fmt(sumTw)+' 鑽';$('sumNtd').textContent='NT$'+fmt(sumTw*price);$('roundNote').textContent=`台服折合鑽石依所選匯率換算並四捨五入。台幣固定按 NT$${price}／台服鑽估算；各項目先各自取整，總計可能與先加總再取整有 1–數鑽差異。`}
renderRows();
</script></body></html>
