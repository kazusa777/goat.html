<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101114">
  <title>雙影片同步比對</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      background: #101114;
      color: #f4f4f5;
      font-synthesis: none;
      --muted: #a1a1aa;
      --line: #303137;
      --panel: #191a1f;
      --accent: #a78bfa;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at top, #1d1b2b 0, #101114 55%); }
    button, input { font: inherit; }
    button { color: inherit; }

    .app { width: min(1880px, 100%); margin: 0 auto; padding: 24px 20px 28px; }
    header { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
    .eyebrow { margin: 0 0 8px; color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(25px, 4vw, 34px); letter-spacing: -.04em; }
    .intro { margin: 9px 0 0; color: var(--muted); font-size: 14px; }
    .local-badge { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; color: #c4c4cc; font-size: 12px; white-space: nowrap; }
    .local-badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #34d399; box-shadow: 0 0 12px #34d39988; }

    .video-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .video-card { overflow: hidden; border: 1px solid var(--line); border-radius: 18px; background: #18191e; box-shadow: 0 20px 60px #0003; }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 15px 16px; border-bottom: 1px solid var(--line); }
    .title-group { display: flex; align-items: center; min-width: 0; gap: 11px; }
    .side-mark { display: grid; place-items: center; flex: 0 0 31px; width: 31px; height: 31px; border: 1px solid #a78bfa55; border-radius: 10px; background: #a78bfa1a; color: #c4b5fd; font-size: 13px; font-weight: 800; }
    .side-title { overflow: hidden; color: #e7e7eb; font-size: 14px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .file-name { overflow: hidden; max-width: min(34vw, 420px); margin-top: 3px; color: var(--muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .card-actions { display: flex; flex-shrink: 0; gap: 8px; }
    .button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 36px; border: 1px solid #3a3b43; border-radius: 10px; padding: 0 11px; background: #23242a; color: #e8e8eb; font-size: 12px; font-weight: 650; cursor: pointer; transition: background .15s ease, border-color .15s ease, transform .15s ease; }
    .button:hover { border-color: #66616f; background: #2b2c33; }
    .button:active { transform: translateY(1px); }
    .button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .button.mute { min-width: 94px; }
    .button.mute[aria-pressed="true"] { border-color: #a78bfa77; background: #a78bfa20; color: #ddd6fe; }
    .file-input { display: none; }

    .screen { position: relative; display: grid; place-items: center; overflow: hidden; aspect-ratio: 16 / 9; background: #090a0d; }
    .screen video { display: block; width: 100%; height: 100%; object-fit: contain; }
    .empty-state { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 12px; padding: 20px; color: #858590; text-align: center; pointer-events: none; }
    .empty-state[hidden] { display: none; }
    .upload-icon { display: grid; place-items: center; width: 48px; height: 48px; border: 1px solid #3a3b43; border-radius: 15px; background: #1a1b20; color: #b7a5f7; }
    .empty-state strong { color: #d6d6dc; font-size: 14px; }
    .empty-state span { font-size: 12px; }
    .screen.dragging { outline: 2px dashed var(--accent); outline-offset: -8px; background: #171323; }

    .transport { margin-top: 20px; border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px 16px; background: #191a1f; box-shadow: 0 20px 60px #0003; }
    .timeline-row { display: grid; grid-template-columns: 54px minmax(0, 1fr) 54px; align-items: center; gap: 14px; }
    .time { color: #d4d4da; font-variant-numeric: tabular-nums; font-size: 12px; }
    .time:last-child { text-align: right; }
    input[type="range"] { width: 100%; height: 5px; border-radius: 999px; appearance: none; background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--progress, 0%), #3b3c44 var(--progress, 0%), #3b3c44 100%); cursor: pointer; }
    input[type="range"]::-webkit-slider-thumb { width: 15px; height: 15px; border: 3px solid #fff; border-radius: 50%; appearance: none; background: var(--accent); box-shadow: 0 1px 6px #0008; }
    input[type="range"]::-moz-range-thumb { width: 11px; height: 11px; border: 3px solid #fff; border-radius: 50%; background: var(--accent); box-shadow: 0 1px 6px #0008; }
    .control-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 18px; }
    .transport-buttons { display: flex; align-items: center; gap: 9px; }
    .button.icon { width: 38px; min-width: 38px; min-height: 38px; padding: 0; color: #c7c7ce; }
    .button.play { width: 48px; min-width: 48px; min-height: 42px; border-color: #a78bfa; background: var(--accent); color: #17131f; }
    .button.play:hover { background: #b7a0ff; }
    .button.play:disabled, .button.icon:disabled { opacity: .42; cursor: not-allowed; }
    .sync-status { color: var(--muted); font-size: 12px; text-align: right; }
    .sync-status span { color: #c4b5fd; }
    .help { margin: 13px 0 0; color: #777780; font-size: 11px; text-align: center; }
    .brightness-panel { margin-top: 17px; padding-top: 15px; border-top: 1px solid var(--line); }
    .brightness-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .brightness-title { display: flex; align-items: baseline; gap: 10px; }
    .brightness-title strong { font-size: 13px; }
    .brightness-title span { color: var(--muted); font-size: 11px; }
    .brightness-sliders { display: grid; gap: 10px; }
    .brightness-row { display: grid; grid-template-columns: 94px minmax(0, 1fr) 48px; align-items: center; gap: 12px; }
    .brightness-row[hidden] { display: none; }
    .brightness-row label { color: #c6c6cd; font-size: 12px; }
    .brightness-row output { color: #e2d9ff; font-variant-numeric: tabular-nums; font-size: 12px; text-align: right; }
    .brightness-row input[type="range"] { --progress: 42.86%; }

    @media (max-width: 760px) {
      .app { padding: 20px 12px 24px; }
      header { align-items: flex-start; flex-direction: column; gap: 14px; }
      .video-grid { grid-template-columns: minmax(0, 1fr); gap: 14px; }
      .file-name { max-width: 38vw; }
      .card-head { padding: 12px; }
      .button { min-height: 34px; padding: 0 9px; }
      .button.mute { min-width: auto; }
      .transport { padding: 15px 13px; }
      .timeline-row { grid-template-columns: 44px minmax(0, 1fr) 44px; gap: 9px; }
      .control-row { align-items: flex-start; }
      .sync-status { max-width: 145px; line-height: 1.5; }
      .brightness-title { align-items: flex-start; flex-direction: column; gap: 3px; }
      .brightness-row { grid-template-columns: 72px minmax(0, 1fr) 42px; gap: 8px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <p class="eyebrow">Video comparison</p>
        <h1>雙影片同步比對</h1>
        <p class="intro">載入兩個影片，共用播放控制與時間軸，即時比較畫面。</p>
      </div>
      <div class="local-badge">影片只在你的裝置上播放</div>
    </header>

    <section class="video-grid" aria-label="影片比較區">
      <article class="video-card" data-side="a">
        <div class="card-head">
          <div class="title-group">
            <div class="side-mark">A</div>
            <div style="min-width:0">
              <div class="side-title">影片 A</div>
              <div class="file-name" id="name-a">尚未選擇影片</div>
            </div>
          </div>
          <div class="card-actions">
            <button class="button mute" id="mute-a" type="button" aria-pressed="false" title="切換影片 A 聲音">
              <svg class="sound-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
              <span>聲音開啟</span>
            </button>
            <button class="button" id="choose-a" type="button">選擇影片</button>
            <input class="file-input" id="file-a" type="file" accept="video/*,.mkv" aria-label="選擇影片 A">
          </div>
        </div>
        <div class="screen" id="screen-a">
          <video id="video-a" playsinline preload="metadata"></video>
          <div class="empty-state" id="empty-a">
            <div class="upload-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m10 8 6 4-6 4V8Z" fill="currentColor"/><rect x="3" y="4" width="18" height="16" rx="4" stroke="currentColor" stroke-width="1.6"/></svg></div>
            <strong>載入第一個影片</strong>
            <span>按「選擇影片」或將影片拖曳到這裡</span>
          </div>
        </div>
      </article>

      <article class="video-card" data-side="b">
        <div class="card-head">
          <div class="title-group">
            <div class="side-mark">B</div>
            <div style="min-width:0">
              <div class="side-title">影片 B</div>
              <div class="file-name" id="name-b">尚未選擇影片</div>
            </div>
          </div>
          <div class="card-actions">
            <button class="button mute" id="mute-b" type="button" aria-pressed="false" title="切換影片 B 聲音">
              <svg class="sound-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
              <span>聲音開啟</span>
            </button>
            <button class="button" id="choose-b" type="button">選擇影片</button>
            <input class="file-input" id="file-b" type="file" accept="video/*,.mkv" aria-label="選擇影片 B">
          </div>
        </div>
        <div class="screen" id="screen-b">
          <video id="video-b" playsinline preload="metadata"></video>
          <div class="empty-state" id="empty-b">
            <div class="upload-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m10 8 6 4-6 4V8Z" fill="currentColor"/><rect x="3" y="4" width="18" height="16" rx="4" stroke="currentColor" stroke-width="1.6"/></svg></div>
            <strong>載入第二個影片</strong>
            <span>按「選擇影片」或將影片拖曳到這裡</span>
          </div>
        </div>
      </article>
    </section>

    <section class="transport" aria-label="同步播放控制">
      <div class="timeline-row">
        <span class="time" id="current-time">00:00</span>
        <input id="timeline" type="range" min="0" max="0" step="0.01" value="0" aria-label="同步播放進度" disabled>
        <span class="time" id="total-time">00:00</span>
      </div>
      <div class="control-row">
        <div class="transport-buttons">
          <button class="button icon" id="back" type="button" title="倒退 5 秒" aria-label="倒退 5 秒" disabled><svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 8V4m0 4h4M4.8 8A8 8 0 1 1 4 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 9v6m2-6h1.5a1.5 1.5 0 0 1 0 3H14m0 0h1.5a1.5 1.5 0 0 1 0 3H14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
          <button class="button play" id="play" type="button" aria-label="播放" disabled><svg id="play-icon" width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m8 5 12 7-12 7V5Z"/></svg></button>
          <button class="button icon" id="forward" type="button" title="快轉 5 秒" aria-label="快轉 5 秒" disabled><svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 8V4m0 4h-4m3.2 0A8 8 0 1 0 20 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 9v6m2-6h1.5a1.5 1.5 0 0 1 0 3H11m0 0h1.5a1.5 1.5 0 0 1 0 3H11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
        </div>
        <div class="sync-status" id="status">請先載入影片</div>
      </div>
      <p class="help">快捷鍵：Space 播放／暫停 · ←／→ 跳轉 5 秒（Shift＋方向鍵跳轉 1 秒）· A／S 靜音影片 A／B · Home 回到開頭</p>
      <div class="brightness-panel" aria-label="亮度控制">
        <div class="brightness-head">
          <div class="brightness-title">
            <strong>影片亮度</strong>
            <span id="brightness-mode">同步調整 A、B</span>
          </div>
          <button class="button" id="brightness-sync" type="button" aria-pressed="true" title="切換同步亮度">同步亮度：開</button>
        </div>
        <div class="brightness-sliders">
          <div class="brightness-row" id="brightness-shared-row">
            <label for="brightness-shared">兩邊影片</label>
            <input id="brightness-shared" type="range" min="25" max="200" step="1" value="100" aria-label="同步調整兩邊影片亮度">
            <output id="brightness-shared-value" for="brightness-shared">100%</output>
          </div>
          <div class="brightness-row" id="brightness-a-row" hidden>
            <label for="brightness-a">影片 A</label>
            <input id="brightness-a" type="range" min="25" max="200" step="1" value="100" aria-label="調整影片 A 亮度">
            <output id="brightness-a-value" for="brightness-a">100%</output>
          </div>
          <div class="brightness-row" id="brightness-b-row" hidden>
            <label for="brightness-b">影片 B</label>
            <input id="brightness-b" type="range" min="25" max="200" step="1" value="100" aria-label="調整影片 B 亮度">
            <output id="brightness-b-value" for="brightness-b">100%</output>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const sides = ["a", "b"];
      const videos = Object.fromEntries(sides.map(side => [side, document.getElementById(`video-${side}`)]));
      const timeline = document.getElementById("timeline");
      const playButton = document.getElementById("play");
      const playIcon = document.getElementById("play-icon");
      const status = document.getElementById("status");
      const brightnessSyncButton = document.getElementById("brightness-sync");
      let isPlaying = false;
      let frameId = 0;
      let sharedTime = 0;
      let duration = 0;
      let brightnessSynced = true;
      const brightness = { a: 100, b: 100 };
      const objectUrls = { a: null, b: null };
      const loaded = { a: false, b: false };

      const readyVideos = () => sides.map(side => videos[side]).filter(video => video.dataset.ready === "true");
      const fmt = seconds => {
        if (!Number.isFinite(seconds) || seconds < 0) seconds = 0;
        const total = Math.floor(seconds);
        const h = Math.floor(total / 3600);
        const m = Math.floor((total % 3600) / 60);
        const s = total % 60;
        return h ? `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}` : `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
      };

      function updateBrightnessUI() {
        document.getElementById("brightness-shared-row").hidden = !brightnessSynced;
        document.getElementById("brightness-a-row").hidden = brightnessSynced;
        document.getElementById("brightness-b-row").hidden = brightnessSynced;
        brightnessSyncButton.setAttribute("aria-pressed", String(brightnessSynced));
        brightnessSyncButton.textContent = `同步亮度：${brightnessSynced ? "開" : "關"}`;
        document.getElementById("brightness-mode").textContent = brightnessSynced ? "同步調整 A、B" : "分別調整 A、B";

        sides.forEach(side => {
          const value = brightness[side];
          videos[side].style.filter = `brightness(${value}%)`;
          const input = document.getElementById(`brightness-${side}`);
          input.value = String(value);
          input.style.setProperty("--progress", `${(value - 25) / 175 * 100}%`);
          document.getElementById(`brightness-${side}-value`).textContent = `${value}%`;
        });
        const shared = document.getElementById("brightness-shared");
        shared.value = String(brightness.a);
        shared.style.setProperty("--progress", `${(brightness.a - 25) / 175 * 100}%`);
        document.getElementById("brightness-shared-value").textContent = `${brightness.a}%`;
      }

      function setBrightness(side, rawValue) {
        const value = Math.max(25, Math.min(200, Math.round(Number(rawValue) || 100)));
        brightness[side] = value;
        if (brightnessSynced) brightness[side === "a" ? "b" : "a"] = value;
        updateBrightnessUI();
      }

      function toggleMute(side) {
        const video = videos[side];
        video.muted = !video.muted;
        const button = document.getElementById(`mute-${side}`);
        button.setAttribute("aria-pressed", String(video.muted));
        button.querySelector("span").textContent = video.muted ? "已靜音" : "聲音開啟";
        button.title = video.muted ? `開啟影片 ${side.toUpperCase()} 聲音` : `關閉影片 ${side.toUpperCase()} 聲音`;
      }

      function updateControls() {
        const anyLoaded = readyVideos().length > 0;
        playButton.disabled = !anyLoaded;
        document.getElementById("back").disabled = !anyLoaded;
        document.getElementById("forward").disabled = !anyLoaded;
        timeline.disabled = !anyLoaded || duration <= 0;
        timeline.max = String(duration || 0);
        timeline.value = String(Math.min(sharedTime, duration || sharedTime));
        document.getElementById("current-time").textContent = fmt(sharedTime);
        document.getElementById("total-time").textContent = fmt(duration);
        const progress = duration > 0 ? Math.min(100, sharedTime / duration * 100) : 0;
        timeline.style.setProperty("--progress", `${progress}%`);
        playIcon.innerHTML = isPlaying
          ? '<path d="M7 5h4v14H7zM15 5h4v14h-4z"/>'
          : '<path d="m8 5 12 7-12 7V5Z"/>';
        playButton.setAttribute("aria-label", isPlaying ? "暫停" : "播放");
        if (!anyLoaded) status.textContent = "請先載入影片";
        else if (loaded.a && loaded.b) status.innerHTML = '<span>雙影片同步</span> · 時間以秒對齊';
        else status.innerHTML = '<span>單影片模式</span> · 載入另一個影片即可比對';
      }

      function updateDuration() {
        duration = readyVideos().reduce((max, video) => Number.isFinite(video.duration) ? Math.max(max, video.duration) : max, 0);
        sharedTime = Math.min(sharedTime, duration || 0);
        updateControls();
      }

      function seekAll(time) {
        const target = Math.max(0, Math.min(Number(time) || 0, duration || 0));
        sharedTime = target;
        readyVideos().forEach(video => {
          const safeTime = Math.min(target, Number.isFinite(video.duration) ? video.duration : target);
          try { video.currentTime = safeTime; } catch (_) { /* metadata may still be loading */ }
        });
        updateControls();
      }

      function syncFrame() {
        if (!isPlaying) return;
        const active = readyVideos().filter(video => !video.paused && !video.ended);
        if (active.length) {
          const master = active[0];
          sharedTime = master.currentTime;
          readyVideos().forEach(video => {
            if (video === master || video.ended) return;
            const target = Math.min(master.currentTime, Number.isFinite(video.duration) ? video.duration : master.currentTime);
            if (Math.abs(video.currentTime - target) > 0.18) {
              try { video.currentTime = target; } catch (_) { /* browser is seeking */ }
            }
          });
          updateControls();
          frameId = requestAnimationFrame(syncFrame);
        } else {
          isPlaying = false;
          readyVideos().forEach(video => video.pause());
          updateControls();
        }
      }

      async function playAll() {
        const currentVideos = readyVideos();
        if (!currentVideos.length) return;
        if (duration && sharedTime >= duration - 0.05) seekAll(0);
        isPlaying = true;
        currentVideos.forEach(video => {
          // Restart a shorter video if it had already reached its end.
          if (video.ended) {
            try { video.currentTime = 0; } catch (_) { /* ignore */ }
          }
        });
        updateControls();
        await Promise.allSettled(currentVideos.map(video => video.play()));
        cancelAnimationFrame(frameId);
        frameId = requestAnimationFrame(syncFrame);
      }

      function pauseAll() {
        isPlaying = false;
        cancelAnimationFrame(frameId);
        readyVideos().forEach(video => video.pause());
        updateControls();
      }

      function setVideo(side, file) {
        if (!file) return;
        const video = videos[side];
        const wasPlaying = isPlaying;
        video.pause();
        video.dataset.ready = "false";
        loaded[side] = false;
        if (objectUrls[side]) URL.revokeObjectURL(objectUrls[side]);
        objectUrls[side] = URL.createObjectURL(file);
        document.getElementById(`name-${side}`).textContent = file.name;
        document.getElementById(`name-${side}`).title = file.name;
        document.getElementById(`empty-${side}`).hidden = true;
        video.src = objectUrls[side];
        video.load();
        video.addEventListener("loadedmetadata", async function onMetadata() {
          video.removeEventListener("loadedmetadata", onMetadata);
          video.dataset.ready = "true";
          loaded[side] = true;
          updateDuration();
          seekAll(sharedTime);
          if (wasPlaying) {
            try { await video.play(); } catch (_) { isPlaying = false; }
          }
          updateControls();
          if (isPlaying) {
            cancelAnimationFrame(frameId);
            frameId = requestAnimationFrame(syncFrame);
          }
        });
        video.addEventListener("error", function onError() {
          video.removeEventListener("error", onError);
          document.getElementById(`name-${side}`).textContent = "無法播放此影片格式";
          document.getElementById(`empty-${side}`).hidden = false;
          document.getElementById(`empty-${side}`).querySelector("strong").textContent = "影片無法播放";
          document.getElementById(`empty-${side}`).querySelector("span").textContent = "請改用瀏覽器支援的影片格式（例如 MP4）";
          video.dataset.ready = "false";
          loaded[side] = false;
          updateDuration();
        }, { once: true });
        updateControls();
      }

      sides.forEach(side => {
        document.getElementById(`choose-${side}`).addEventListener("click", () => document.getElementById(`file-${side}`).click());
        document.getElementById(`file-${side}`).addEventListener("change", event => {
          setVideo(side, event.target.files && event.target.files[0]);
          event.target.value = "";
        });
        document.getElementById(`mute-${side}`).addEventListener("click", () => toggleMute(side));
        const screen = document.getElementById(`screen-${side}`);
        screen.addEventListener("dragover", event => { event.preventDefault(); screen.classList.add("dragging"); });
        screen.addEventListener("dragleave", () => screen.classList.remove("dragging"));
        screen.addEventListener("drop", event => {
          event.preventDefault();
          screen.classList.remove("dragging");
          const file = [...event.dataTransfer.files].find(item => item.type.startsWith("video/") || /\.(mp4|mov|webm|m4v|mkv|ogv)$/i.test(item.name));
          if (file) setVideo(side, file);
        });
      });

      playButton.addEventListener("click", () => isPlaying ? pauseAll() : playAll());
      document.getElementById("back").addEventListener("click", () => seekAll(sharedTime - 5));
      document.getElementById("forward").addEventListener("click", () => seekAll(sharedTime + 5));
      timeline.addEventListener("input", event => seekAll(event.target.value));
      brightnessSyncButton.addEventListener("click", () => {
        brightnessSynced = !brightnessSynced;
        if (brightnessSynced) brightness.b = brightness.a;
        updateBrightnessUI();
      });
      document.getElementById("brightness-shared").addEventListener("input", event => setBrightness("a", event.target.value));
      sides.forEach(side => document.getElementById(`brightness-${side}`).addEventListener("input", event => setBrightness(side, event.target.value)));
      window.addEventListener("keydown", event => {
        if (event.ctrlKey || event.metaKey || event.altKey) return;
        if (event.repeat && ["Space", "KeyA", "KeyS"].includes(event.code)) return;
        const target = event.target;
        const tag = target && target.tagName ? target.tagName : "";
        if ((target && target.isContentEditable) || ["INPUT", "TEXTAREA", "SELECT"].includes(tag)) return;
        if (event.code === "Space") {
          if (tag === "BUTTON") return;
          event.preventDefault();
          if (readyVideos().length) isPlaying ? pauseAll() : playAll();
        } else if (event.code === "ArrowLeft" || event.code === "ArrowRight") {
          event.preventDefault();
          const amount = event.shiftKey ? 1 : 5;
          seekAll(sharedTime + (event.code === "ArrowRight" ? amount : -amount));
        } else if (event.code === "Home") {
          event.preventDefault();
          seekAll(0);
        } else if (event.code === "KeyA") {
          toggleMute("a");
        } else if (event.code === "KeyS") {
          toggleMute("b");
        }
      });
      window.addEventListener("beforeunload", () => sides.forEach(side => objectUrls[side] && URL.revokeObjectURL(objectUrls[side])));
      updateBrightnessUI();
      updateControls();
    })();
  </script>
</body>
</html>
