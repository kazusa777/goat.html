<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>賽爾號鑽石轉換工具</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#141c30;--line:#293752;--text:#edf3ff;--muted:#aab8d0;--cyan:#67e8f9;--blue:#818cf8;--gold:#facc15}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 20% 0%,#1b3151 0,transparent 45%),var(--bg);color:var(--text);font:16px/1.55 system-ui,"Microsoft JhengHei",sans-serif;padding:32px 16px 56px}.wrap{max-width:1700px;margin:auto}.columns{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.25fr);gap:24px;align-items:start}.left-column,.right-column{min-width:0}.left-column .card,.right-column .card{margin-top:0}.right-column>section{position:sticky;top:18px}header{margin:0 0 24px}h1{font-size:clamp(26px,5vw,38px);line-height:1.2;margin:0 0 8px;letter-spacing:.02em}.sub,.muted{color:var(--muted)}.card{background:linear-gradient(145deg,#17223a,#11192b);border:1px solid var(--line);border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 12px 32px #0002}.label{display:block;font-weight:700;margin-bottom:7px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.field input,select{width:100%;padding:13px 14px;border-radius:11px;border:1px solid #394968;background:#0c1425;color:var(--text);font-size:17px;outline:none}.field input:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #67e8f922}.hint{font-size:13px;color:var(--muted);margin-top:6px}.split{display:flex;gap:14px;align-items:end;flex-wrap:wrap}.split>div{flex:1;min-width:210px}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.result{background:#0c1425;border:1px solid #293752;border-radius:13px;padding:16px}.result small{display:block;color:var(--muted);margin-bottom:4px}.result strong{font-size:23px}.accent{color:var(--cyan)}.gold{color:var(--gold)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:620px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #293752}th{color:var(--muted);font-size:14px}td:last-child,th:last-child{text-align:right}.total{font-weight:800;color:var(--gold)}.items{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{border:1px solid var(--line);background:#0c1425;border-radius:12px;padding:12px}.item label{display:flex;align-items:center;gap:9px;font-weight:700}.item input{accent-color:#67e8f9;width:17px;height:17px}.item span{display:block;color:var(--muted);font-size:13px;margin:5px 0 0 26px}.foot{font-size:13px;color:var(--muted);margin-top:14px}.pill{display:inline-block;color:#c4b5fd;background:#8b5cf622;border:1px solid #8b5cf655;border-radius:99px;padding:3px 10px;font-size:13px;margin-left:8px}.rate-head{display:grid;grid-template-columns:1fr;gap:14px}.rate-head>div{min-width:0}.rate-head select{display:block;width:100%}.rate-form{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:10px;align-items:end;margin-top:18px}.rate-form input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid #394968;background:#0c1425;color:var(--text);font-size:16px}.rate-form button{padding:11px 16px;border:0;border-radius:10px;background:linear-gradient(100deg,#67e8f9,#818cf8);color:#101629;font-size:15px;font-weight:800;cursor:pointer}.notice{min-height:22px;color:var(--cyan);font-size:13px;margin-top:8px}
@media(max-width:1200px){.columns{grid-template-columns:1fr}.right-column>section{position:static}}
@media(max-width:650px){body{padding:22px 12px 40px}.card{padding:17px}.grid,.results{grid-template-columns:1fr}.items{grid-template-columns:1fr}.rate-form{grid-template-columns:1fr 1fr}.rate-form>div:first-child{grid-column:1/-1}}
</style>
</head>
<body><main class="wrap">
<header><h1>賽爾號鑽石轉換工具</h1><div class="sub">輸入台幣、台服鑽石或陸服鑽石，立即換算另外兩種金額。</div></header>
<div class="columns"><div class="left-column"><section class="card"><div class="split rate-head"><div><label class="label" for="rate">匯率方案</label><select id="rate"></select><button id="deleteRate" type="button" style="margin-top:8px;padding:8px 12px;border:1px solid #f87171;border-radius:9px;background:#25131b;color:#fca5a5;font-weight:700;cursor:pointer">刪除選取方案</button></div><div><span class="label">台幣換算</span><div style="padding:13px 14px;border-radius:11px;border:1px solid #394968;background:#0c1425;color:var(--cyan);font-weight:700">台服 1 鑽 = NT$5</div></div></div><form id="rateForm" class="rate-form"><div><label class="label" for="rateName">新增方案名稱</label><input id="rateName" maxlength="32" placeholder="例如：活動匯率" required></div><div><label class="label" for="rateCn">陸服鑽石</label><input id="rateCn" type="number" min="1" step="any" placeholder="680" required></div><div><label class="label" for="rateTw">台服鑽石</label><input id="rateTw" type="number" min="1" step="any" placeholder="78" required></div><button type="submit">新增方案</button></form><div id="rateNotice" class="notice" aria-live="polite"></div><button id="saveHtml" type="button" style="padding:10px 14px;border:1px solid #67e8f9;border-radius:10px;background:#0c1425;color:var(--cyan);font-weight:700;cursor:pointer">直接儲存方案至 HTML</button><div class="hint">第一次按下時選取這份 HTML 檔並授權；之後可直接儲存。</div></section>
<section class="card"><div class="grid"><div class="field"><label class="label" for="ntd">台幣 (NT$)</label><input id="ntd" type="number" min="0" step="any" placeholder="輸入台幣"></div><div class="field"><label class="label" for="tw">台服鑽石</label><input id="tw" type="number" min="0" step="any" placeholder="輸入台服鑽石"></div><div class="field"><label class="label" for="cn">陸服鑽石</label><input id="cn" type="number" min="0" step="any" placeholder="輸入陸服鑽石"></div></div><div class="hint">可編輯任一欄位；鑽石換算採四捨五入至整數。</div></section>
<section class="card"><h2 style="margin:0 0 14px;font-size:19px">換算結果</h2><div class="results"><div class="result"><small>台幣估算</small><strong class="gold" id="outNtd">—</strong></div><div class="result"><small>台服鑽石</small><strong class="accent" id="outTw">—</strong></div><div class="result"><small>陸服鑽石</small><strong id="outCn">—</strong></div></div></section>
</div><div class="right-column"><section class="card"><div class="split" style="align-items:center;justify-content:space-between"><div><h2 style="margin:0;font-size:19px">預算清單</h2><div class="hint">勾選項目計算總預算；妙時天女可選大禮包。</div></div><label style="display:flex;align-items:center;gap:8px"><input id="bundle" type="checkbox" style="accent-color:#67e8f9;width:17px;height:17px">妙時天女大禮包</label></div><div class="card" style="margin:16px 0 4px;background:#0c1425;box-shadow:none"><div class="field"><label class="label" for="currentTw">目前台服鑽石數量</label><input id="currentTw" type="number" min="0" step="1" placeholder="輸入目前持有的台服鑽石"></div><div class="results" style="margin-top:14px"><div class="result"><small>目前台服鑽石</small><strong class="accent" id="haveTw">0 鑽</strong></div><div class="result"><small>還需要台服鑽石</small><strong class="gold" id="needTw">0 鑽</strong></div><div class="result"><small>還需要台幣</small><strong class="gold" id="needNtd">NT$0</strong></div></div><div class="hint" id="remainingNote">輸入目前持有量後，會依勾選的預算項目即時扣除。</div></div><div class="tablewrap" style="margin-top:12px"><table><thead><tr><th>項目</th><th>陸服鑽石</th><th>台服折合</th><th>台幣預估</th><th></th></tr></thead><tbody id="rows"></tbody><tfoot><tr class="total"><td>勾選總計</td><td id="sumCn">0 鑽</td><td id="sumTw">0 鑽</td><td id="sumNtd">NT$0</td><td></td></tr></tfoot></table></div><div class="foot" id="roundNote"></div></section></div></div>
</main><script>
const builtInProfiles=[{id:'a',name:'方案一：陸服 680 鑽 = 台服 78 鑽',cn:680,tw:78},{id:'b',name:'方案二：陸服 998 鑽 = 台服 140 鑽',cn:998,tw:140}];
const storageKey='seercn-diamond-rate-profiles-v1';
const embeddedProfiles=[];
const embeddedSelected='a';
let customProfiles=[...embeddedProfiles];
try{const saved=JSON.parse(localStorage.getItem(storageKey)||'[]');if(Array.isArray(saved)){for(const x of saved){if(x&&typeof x.id==='string'&&typeof x.name==='string'&&Number(x.cn)>0&&Number(x.tw)>0&&!customProfiles.some(p=>p.id===x.id))customProfiles.push({id:x.id,name:x.name,cn:Number(x.cn),tw:Number(x.tw)})}}}catch{}
const baseItems=[{name:'薇爾詩',cn:798,checked:true},{name:'妙時天女',cn:998,checked:true},{name:'黃金殘影刻印（2組）',cn:6376,checked:true},{name:'赤洲龍子刻印（2組）',cn:7172,checked:true}];
const ids=['ntd','tw','cn'];let last='';const $=id=>document.getElementById(id);const fmt=n=>Math.round(n).toLocaleString('zh-TW');
function allProfiles(){return [...builtInProfiles,...customProfiles]}
function currentProfile(){return allProfiles().find(x=>x.id===$('rate').value)||builtInProfiles[0]}
function refreshProfileOptions(selectedId){const select=$('rate');select.replaceChildren();for(const profile of allProfiles()){const option=document.createElement('option');option.value=profile.id;option.textContent=profile.name;select.appendChild(option)}if(selectedId&&allProfiles().some(x=>x.id===selectedId))select.value=selectedId}
function updateDeleteButton(){const isBuiltIn=builtInProfiles.some(x=>x.id===$('rate').value);$('deleteRate').disabled=isBuiltIn;$('deleteRate').style.opacity=isBuiltIn?'.45':'1';$('deleteRate').style.cursor=isBuiltIn?'not-allowed':'pointer'}
let selectedProfile='a';try{selectedProfile=localStorage.getItem(storageKey+':selected')||embeddedSelected}catch{selectedProfile=embeddedSelected}refreshProfileOptions(selectedProfile);updateDeleteButton();
const price=5;
function convert(from,value){const p=currentProfile();let tw,cn,ntd;if(from==='ntd'){ntd=value;tw=value/price;cn=tw*p.cn/p.tw}else if(from==='tw'){tw=value;cn=tw*p.cn/p.tw;ntd=tw*price}else{cn=value;tw=cn*p.tw/p.cn;ntd=tw*price}return {ntd,tw,cn}}
function show(from){const raw=$(from).value;if(raw===''){for(const id of ids)if(id!==from)$(id).value='';$('outNtd').textContent=$('outTw').textContent=$('outCn').textContent='—';last=from;return}const r=convert(from,Number(raw));for(const id of ids)if(id!==from)$(id).value=String(Math.round(r[id]));$('outNtd').textContent='NT$'+fmt(r.ntd);$('outTw').textContent=fmt(r.tw)+' 鑽';$('outCn').textContent=fmt(r.cn)+' 鑽';last=from}
ids.forEach(id=>$(id).addEventListener('input',()=>show(id)));$('rate').addEventListener('change',()=>{try{localStorage.setItem(storageKey+':selected',$('rate').value)}catch{}if(last&&$(last).value!=='')show(last);renderRows();updateDeleteButton()});$('bundle').addEventListener('change',renderRows);$('currentTw').addEventListener('input',renderRows);
$('deleteRate').addEventListener('click',()=>{const id=$('rate').value;if(builtInProfiles.some(x=>x.id===id))return;const profile=customProfiles.find(x=>x.id===id);if(!profile)return;customProfiles=customProfiles.filter(x=>x.id!==id);try{localStorage.setItem(storageKey,JSON.stringify(customProfiles));localStorage.setItem(storageKey+':selected','a')}catch{}refreshProfileOptions('a');updateDeleteButton();$('rateNotice').textContent=`已刪除「${profile.name}」。按「直接儲存方案至 HTML」即可同步更新檔案。`;if(last&&$(last).value!=='')show(last);renderRows()});
let htmlFileHandle=null;
const handleDb=new Promise((resolve,reject)=>{const request=indexedDB.open('diamond-html-save',1);request.onupgradeneeded=()=>request.result.createObjectStore('handles');request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)});
async function getStoredHandle(){try{const db=await handleDb;return await new Promise((resolve,reject)=>{const request=db.transaction('handles').objectStore('handles').get('target');request.onsuccess=()=>resolve(request.result||null);request.onerror=()=>reject(request.error)})}catch{return null}}
async function storeHandle(handle){const db=await handleDb;return new Promise((resolve,reject)=>{const request=db.transaction('handles','readwrite').objectStore('handles').put(handle,'target');request.onsuccess=()=>resolve();request.onerror=()=>reject(request.error)})}
function makeHtml(){let source=document.documentElement.outerHTML;source=source.replace('const embeddedProfiles=[];',`const embeddedProfiles=${JSON.stringify(customProfiles).replace(/</g,'\\u003c')};`);source=source.replace("const embeddedSelected='a';",`const embeddedSelected=${JSON.stringify($('rate').value)};`);return '<!doctype html>\\n'+source}
function downloadHtml(){const blob=new Blob([makeHtml()],{type:'text/html;charset=utf-8'}),link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='賽爾號鑽石轉換工具-已儲存方案.html';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)}
$('saveHtml').addEventListener('click',async()=>{const notice=$('rateNotice');if(!window.showSaveFilePicker){downloadHtml();notice.textContent='此瀏覽器不支援直接寫入，已下載含方案的 HTML。';return}try{if(!htmlFileHandle)htmlFileHandle=await getStoredHandle();if(htmlFileHandle){let permission=await htmlFileHandle.queryPermission({mode:'readwrite'});if(permission!=='granted')permission=await htmlFileHandle.requestPermission({mode:'readwrite'});if(permission!=='granted')htmlFileHandle=null}if(!htmlFileHandle){htmlFileHandle=await window.showSaveFilePicker({suggestedName:'賽爾號鑽石轉換工具.html',types:[{description:'HTML 網頁',accept:{'text/html':['.html']}}]});await storeHandle(htmlFileHandle)}const writable=await htmlFileHandle.createWritable();await writable.write(makeHtml());await writable.close();notice.textContent='方案已直接儲存到選取的 HTML 檔。'}catch(error){if(error.name==='AbortError'){notice.textContent='已取消選取檔案。';return}downloadHtml();notice.textContent='無法直接寫入此檔案，已改為下載含方案的 HTML。'}});$('rateForm').addEventListener('submit',event=>{event.preventDefault();const name=$('rateName').value.trim(),cn=Number($('rateCn').value),tw=Number($('rateTw').value),notice=$('rateNotice');if(!name||!Number.isFinite(cn)||!Number.isFinite(tw)||cn<=0||tw<=0){notice.textContent='請填入名稱及大於 0 的鑽石數量。';return}const id='custom-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);customProfiles.push({id,name,cn,tw});try{localStorage.setItem(storageKey,JSON.stringify(customProfiles));localStorage.setItem(storageKey+':selected',id);refreshProfileOptions(id);notice.textContent='方案已新增並儲存在這個瀏覽器。'}catch{customProfiles.pop();notice.textContent='瀏覽器無法儲存資料，請確認本機儲存空間可用。';return}event.target.reset();if(last&&$(last).value!=='')show(last);renderRows()});
function renderRows(){const p=currentProfile(),bundle=$('bundle').checked;let sumCn=0,sumTw=0;const tbody=$('rows');tbody.innerHTML='';baseItems.forEach((item,i)=>{const cn=item.cn+(i===1&&bundle?1000:0),tw=Math.round(cn*p.tw/p.cn),ntd=tw*price;sumCn+=cn;sumTw+=tw;const tr=document.createElement('tr');tr.innerHTML=`<td>${item.name}${i===1&&bundle?' <span class="pill">大禮包</span>':''}</td><td>${fmt(cn)} 鑽</td><td>${fmt(tw)} 鑽</td><td>NT$${fmt(ntd)}</td><td><input type="checkbox" aria-label="計入${item.name}" ${item.checked?'checked':''}></td>`;const cb=tr.querySelector('input');cb.addEventListener('change',()=>{item.checked=cb.checked;renderRows()});tbody.appendChild(tr)});const selected=baseItems.filter(x=>x.checked);sumCn=selected.reduce((s,x,i)=>s+x.cn+(x.name==='妙時天女'&&bundle?1000:0),0);sumTw=selected.reduce((s,x)=>s+Math.round((x.cn+(x.name==='妙時天女'&&bundle?1000:0))*p.tw/p.cn),0);$('sumCn').textContent=fmt(sumCn)+' 鑽';$('sumTw').textContent=fmt(sumTw)+' 鑽';$('sumNtd').textContent='NT$'+fmt(sumTw*price);const currentRaw=$('currentTw').value,current=currentRaw===''?0:Math.max(0,Number(currentRaw)||0),remaining=Math.max(0,sumTw-current);$('haveTw').textContent=fmt(current)+' 鑽';$('needTw').textContent=fmt(remaining)+' 鑽';$('needNtd').textContent='NT$'+fmt(remaining*price);$('remainingNote').textContent=currentRaw===''?'輸入目前持有量後，會依勾選的預算項目即時扣除。':current>=sumTw?'目前鑽石已足夠，還需要 0 鑽（NT$0）。':`已扣除目前持有的 ${fmt(current)} 鑽；台幣按 NT$${price}／鑽計算。`;$('roundNote').textContent=`台服折合鑽石依「${p.name}」換算並四捨五入。台幣固定按 NT$${price}／台服鑽估算；各項目先各自取整，總計可能與先加總再取整有 1–數鑽差異。`}
renderRows();
</script></body></html>
